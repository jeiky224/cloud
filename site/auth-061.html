
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; connect-src https://accounts.google.com/gsi/ https://oauth2.googleapis.com; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; base-uri 'none'; object-src 'none'; form-action 'none'">

<title>Wayward CloudSave 0.6.1 | Google 계정 연결</title>

<link rel="stylesheet" href="./auth-061.css">
<style>
/* Keep internal handshake details out of the visible login UI. */
#origin-detail,
#account-status:not(.error),
#status:not(.error) {
    display: none !important;
}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./auth-061.js" defer></script>
</head>

<body>
<main class="glass-card">

    <header class="brand-row">
        <span class="brand">WAYWARD <span>/</span> CLOUDSAVE</span>
        <span class="secure-mark" aria-hidden="true">◇</span>
    </header>

    <section class="intro">
        <p class="eyebrow">SECURE CONNECTION</p>
        <h1>게임 연결</h1>
        <p class="description">
            Google 계정을 연결해 클라우드 세이브를 이용하세요.
        </p>
    </section>

    <section class="connection-state" aria-live="polite">
        <div class="state-heading">
            <span class="state-indicator" aria-hidden="true"></span>
            <strong id="origin-title">게임 연결 확인 중…</strong>
        </div>

        <p id="origin-detail">
            요청한 게임 창과 보안 연결을 확인하고 있습니다.
        </p>

        <p id="origin-value" class="origin-value"></p>
    </section>

    <section class="connect-area">
        <p id="account-status" role="status" aria-live="polite">
            게임 연결을 기다리고 있습니다.
        </p>

        <button id="connect" type="button" disabled>
            Google 계정 연결
        </button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">
        인증 환경 확인 중…
    </p>

    <footer class="footnote">
        Google 보안 인증 · 액세스 토큰은 게임 실행 중 메모리에서만 사용됩니다.
    </footer>

</main>
</body>
</html>
