name: Deploy CloudSave static authentication pages

on:
  push:
    branches:
      - work/cloudsave-pages-drive-owner-20261113
    paths:
      - 'site/**'
      - 'README.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cloudsave-static-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static page source
        uses: actions/checkout@v4

      - name: Read the pre-enabled GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Upload static page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy static pages
        id: deployment
        uses: actions/deploy-pages@v4
