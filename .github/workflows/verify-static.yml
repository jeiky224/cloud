name: Verify CloudSave static authentication pages

on:
  push:
    branches:
      - work/cloudsave-pages-drive-owner-20261113
    paths:
      - 'site/**'
      - 'verification/**'
      - '.github/workflows/verify-static.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'verification/**'
      - '.github/workflows/verify-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check site/auth.js
          node --check site/auth-061.js
          node --check site/drive.js
          node --check site/config.js
      - name: Token-isolated auth and Drive bridge tests
        run: node --test verification/static-auth.test.cjs
      - name: CloudSave 0.6.1 one-time token endpoint tests
        run: node --test verification/auth-061.test.cjs
      - name: Reject custom service dependencies and secrets
        run: |
          ! grep -RniE 'vercel\.app|workers\.dev|cloudflare|render\.com|client_secret|refresh_token|token_endpoint' site
          ! grep -RniE 'fetch\([^\n]*(vercel|workers|cloudflare|render)' site
      - name: Export static page source for isolated browser runtime checks
        run: |
          mkdir -p test-artifact
          cp -R site test-artifact/
          cp verification/static-auth.test.cjs test-artifact/
          cd test-artifact
          zip -qr ../cloudsave-static-auth-runtime.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: cloudsave-static-auth-runtime
          path: cloudsave-static-auth-runtime.zip
          if-no-files-found: error
